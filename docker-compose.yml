services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
      # Windows bind mounts do not propagate fs events into Linux; polling fixes uvicorn --reload.
      WATCHFILES_FORCE_POLLING: "true"
    env_file:
      - path: ./backend/.env
        required: false
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      # Same for Vite HMR when the app dir is a host bind mount.
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

volumes:
  frontend_node_modules:
